name: Complete source CodeQL

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, python, actions]
    env:
      LANGUAGE: ${{ matrix.language }}
      REVIEWED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      CODEQL_VERSION: 2.27.3
      CODEQL_BUNDLE_SHA256: 5e7607e1b721728955e31f5402d460ad227cbd2ffed0d4cc610116755796150e
      CODEQL_EXTRACTOR_JAVASCRIPT_ALLOW_MINIFIED_FILES: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.1'
      - name: Bind the complete reviewed source and current stable CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(id -u)" -ne 0
          stage="$RUNNER_TEMP/cps-codeql"
          mkdir -p "$stage/evidence"
          printf 'CPS_EVIDENCE=%s\n' "$stage/evidence" >> "$GITHUB_ENV"
          python tools/audit_codeql_source.py before "$stage/evidence"
          curl --fail --location --retry 3 --output "$stage/bundle.tar.zst" \
            "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_VERSION}/codeql-bundle-linux64.tar.zst"
          printf '%s  %s\n' "$CODEQL_BUNDLE_SHA256" "$stage/bundle.tar.zst" | sha256sum --check
          tar --zstd -xf "$stage/bundle.tar.zst" -C "$stage"
          "$stage/codeql/codeql" version --format=json > "$stage/evidence/cli-version.json"
      - name: Extract the whole source without path or PR-diff exclusions
        shell: bash
        run: |
          set -euo pipefail
          export LGTM_INDEX_INCLUDE='.'
          "$RUNNER_TEMP/cps-codeql/codeql/codeql" database create "$RUNNER_TEMP/cps-codeql/database" \
            --language="$LANGUAGE" --build-mode=none --source-root="$GITHUB_WORKSPACE" \
            --threads=2 --ram=6000 2>&1 | tee "$CPS_EVIDENCE/create.log"
          cp "$RUNNER_TEMP/cps-codeql/database/src.zip" "$CPS_EVIDENCE/extracted-source.zip"
      - name: Analyze the complete security and quality suite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/cps-codeql/codeql/codeql" database analyze "$RUNNER_TEMP/cps-codeql/database" \
            "codeql/${LANGUAGE}-queries:codeql-suites/${LANGUAGE}-security-and-quality.qls" \
            --format=sarifv2.1.0 --sarif-category="/language:$LANGUAGE" \
            --output="$CPS_EVIDENCE/full-source.sarif" --threads=2 --ram=6000 \
            2>&1 | tee "$CPS_EVIDENCE/analyze.log"
      - name: Record actual inline-script and event-handler extraction
        if: matrix.language == 'javascript'
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/cps-codeql/codeql/codeql"
          "$cli" pack install .github/codeql/coverage 2>&1 | tee "$CPS_EVIDENCE/coverage-pack.log"
          cp .github/codeql/coverage/codeql-pack.lock.yml "$CPS_EVIDENCE/coverage-pack.lock.yml"
          "$cli" query run .github/codeql/coverage/embedded-source.ql \
            --database="$RUNNER_TEMP/cps-codeql/database" --output="$CPS_EVIDENCE/embedded-source.bqrs" \
            --threads=2 --ram=6000 2>&1 | tee "$CPS_EVIDENCE/coverage-query.log"
          "$cli" bqrs decode "$CPS_EVIDENCE/embedded-source.bqrs" --format=csv \
            --output="$CPS_EVIDENCE/embedded-source.csv"
      - name: Verify source coverage and retain every reported finding
        id: audit
        if: always()
        shell: bash
        run: python tools/audit_codeql_source.py verify "$RUNNER_TEMP/cps-codeql/evidence"
      - name: Publish all raw findings after approved advanced-setup adoption
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.audit.outputs.sarif_present == 'true'
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/cps-codeql/evidence/full-source.sarif
          category: /language:${{ matrix.language }}
      - name: Retain source, extraction, query and unfiltered result evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: complete-source-codeql-${{ matrix.language }}
          path: ${{ runner.temp }}/cps-codeql/evidence/
          if-no-files-found: error
          retention-days: 7
